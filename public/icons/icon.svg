<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Handshake / Collab icon - two people connecting -->
  <g transform="translate(256,240)" fill="white">
    <!-- Left person -->
    <circle cx="-80" cy="-60" r="40"/>
    <path d="M-130,-10 Q-130,50 -80,50 Q-30,50 -30,-10 Z" />
    <!-- Right person -->
    <circle cx="80" cy="-60" r="40"/>
    <path d="M30,-10 Q30,50 80,50 Q130,50 130,-10 Z" />
    <!-- Connection heart/link in center -->
    <path d="M-15,20 Q0,-5 15,20 Q0,45 -15,20 Z" fill="#fbbf24"/>
  </g>
  <!-- IX text at bottom -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="72" fill="white" opacity="0.9">IX</text>
</svg>
